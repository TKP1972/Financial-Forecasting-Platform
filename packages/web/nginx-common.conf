# Everything inside a `server` block that is the same over HTTP and HTTPS.
#
# Included by both nginx-http.conf and nginx-tls.conf so the two cannot drift -
# a security header that exists on one listener and not the other is exactly the
# kind of difference nobody notices until it matters.

root /usr/share/nginx/html;
index index.html;

# The app calls the API on a relative path, so proxy it here rather than
# pointing the browser at a second origin. Same-origin means no CORS
# preflights, no third-party-cookie problems, and identical behaviour to the
# Vite dev proxy - the front end needs no environment-specific configuration.
#
# `api` is the compose service name, resolved on the internal network.
location /api/ {
  proxy_pass http://api:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # The API trusts this to decide whether the connection was secure, so it must
  # reflect the listener the browser actually reached - not a fixed value.
  proxy_set_header X-Forwarded-Proto $scheme;

  # Report generation and Monte Carlo runs can take a while; the 60s default
  # would cut off a large export mid-stream.
  proxy_connect_timeout 10s;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  # Excel exports are streamed, so buffering them whole adds latency for no gain.
  proxy_buffering off;
}

# The SPA owns client-side routing, so any unmatched path must return
# index.html rather than a 404 - otherwise a deep link like /budgets/abc
# breaks on refresh.
location / {
  try_files $uri $uri/ /index.html;
}

# Vite emits content-hashed filenames, so these are safe to cache forever.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# index.html must never be cached, or a deploy leaves clients on stale asset
# references that no longer exist.
location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  expires 0;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

server_tokens off;
