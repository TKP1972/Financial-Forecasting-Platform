# HTTPS. Selected automatically when a certificate and key are mounted at
# /etc/nginx/certs - see docker-entrypoint.sh.
#
# The platform carries salary-bearing headcount plans, unpublished pricing and
# approval decisions. Those should not cross even an internal network in clear
# text, and a session cookie that can be read off the wire makes every other
# control in the system decorative.

server {
  listen 80;
  server_name _;

  # A 301 makes browsers remember the upgrade; the HSTS header below then keeps
  # them from trying HTTP again at all.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # TLS 1.2 and 1.3 only. 1.0/1.1 are withdrawn and no browser this app supports
  # needs them.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Six months, no preload. Preloading is close to irreversible and is not a
  # decision a container image should make on an operator's behalf.
  add_header Strict-Transport-Security "max-age=15768000" always;

  include /etc/nginx/snippets/app.conf;
}
