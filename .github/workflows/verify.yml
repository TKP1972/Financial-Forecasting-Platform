# Continuous verification.
#
# `npm run verify` was already the definition of this job long before there was
# anywhere to run it - format, lint, repo invariants, the library build,
# typecheck, 1000+ unit tests and the api coverage floor. This workflow just
# gives it somewhere to run on every push, so the checks stop depending on
# somebody remembering to run them.
#
# The end-to-end suites are deliberately NOT here. They need Postgres, the API
# and the web app running, and the browser journeys additionally need Chrome -
# a runner without one fails for want of a browser rather than for a defect.
#
# They are no longer excluded because any of them is one-shot. smoke-test-rolling
# .ps1 used to consume the seeded cycle's open periods and exit 1 afterwards; it
# now provisions its own annual cycle each run, so every suite is idempotent and
# repeatable against the same database. Standing the stack up in CI is the only
# thing between here and running them.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated, not vendored, and there is no
      # postinstall hook. Without this the api typecheck fails on every model
      # type - Prisma.NotificationCreateManyInput and friends do not exist
      # until the client is generated.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify
        run: npm run verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
